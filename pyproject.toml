[project]
name = "tp-transformers"
version = "0.1.0"
description = "TP Architecture Transformer : RNN, LSTM, Transformer, GPT-2, BERT et exercices pratiques"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5.0",
    "transformers>=4.46.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "ipykernel>=6.29.0",
    "nbformat>=5.10.0",
    "nbclient>=0.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
tp-transformers = "tp_transformers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tp_transformers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
